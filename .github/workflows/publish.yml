# Publish to npm when a GitHub Release is published.
#
# Authentication is OIDC trusted publishing, not a token. There is no NPM_TOKEN
# secret in this repository and there should never be one: npm stripped
# bypass-2FA granular tokens of account management in August 2026 and removes
# their direct-publish ability in January 2027, after which a token can only
# stage a publish for human 2FA approval.
#
# The trust relationship is registered against this repo, THIS FILENAME
# (publish.yml), and the `npm` environment. Renaming either silently breaks
# publishing with an opaque 401 that reads like bad credentials, so change one
# only alongside:
#
#   npm trust github chapa-cli --repo juan294/chapa-cli \
#     --file publish.yml --env npm --allow-publish
#
# src/publish-workflow.test.ts guards those bindings.

name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Scoped to this job only — this is what mints the OIDC token npm
      # exchanges for short-lived publish rights.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release provenance
        run: |
          if [ "${{ github.event.release.target_commitish }}" != "main" ]; then
            echo "::error::Release target_commitish must be 'main' (got '${{ github.event.release.target_commitish }}')."
            exit 1
          fi

          git fetch --no-tags origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::Release tag commit $GITHUB_SHA is not reachable from origin/main."
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${PKG_VERSION}' (expected tag '${EXPECTED_TAG}')."
            exit 1
          fi

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        # Node 22 still bundles npm 10.9, which has no OIDC support at all and
        # fails with a bare 401 that reads like a credentials problem. Trusted
        # publishing needs >= 11.5.1, so upgrade before anything touches the
        # registry and record the version in the log.
        run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm test

      - run: pnpm run build

      - name: Publish
        # No NODE_AUTH_TOKEN. npm detects the OIDC environment, exchanges the
        # id-token for a short-lived publish credential, and attaches SLSA
        # provenance automatically.
        run: npm publish --provenance --access public
