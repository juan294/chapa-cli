# Publish to npm when a GitHub Release is published.
#
# Uses an npm automation token (NPM_TOKEN secret) which bypasses 2FA/OTP.
# Generate a granular access token scoped to this package with read-write
# permissions. The token-expiry-reminder workflow tracks rotation.

name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release provenance
        run: |
          if [ "${{ github.event.release.target_commitish }}" != "main" ]; then
            echo "::error::Release target_commitish must be 'main' (got '${{ github.event.release.target_commitish }}')."
            exit 1
          fi

          git fetch --no-tags origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::Release tag commit $GITHUB_SHA is not reachable from origin/main."
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${PKG_VERSION}' (expected tag '${EXPECTED_TAG}')."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm test

      - run: pnpm run build

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
